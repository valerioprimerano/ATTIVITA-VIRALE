name: Rinnova il codice Instagram

# Il codice di accesso a Instagram dura 60 giorni: ogni settimana lo rinnoviamo e lo salviamo tra i segreti.
# Serve il segreto GH_PAT (un token GitHub con permesso "Secrets: read and write" su questo progetto).
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

jobs:
  rinnova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rinnova e salva
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$IG_TOKEN" ] || [ -z "$GH_TOKEN" ]; then echo "Mancano IG_TOKEN o GH_PAT: niente da fare."; exit 0; fi
          NUOVO=$(node -e 'import("./raccoglitore/instagram.mjs").then(m=>m.rinnovaToken(process.env.IG_TOKEN)).then(t=>process.stdout.write(t))')
          echo "::add-mask::$NUOVO"
          gh secret set IG_TOKEN --body "$NUOVO" --repo "$GITHUB_REPOSITORY"
          echo "Codice rinnovato."
