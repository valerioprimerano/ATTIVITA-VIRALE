name: Aggiorna il gioco

# Ogni 10 minuti legge i commenti su Instagram, aggiorna la mappa e pubblica il sito.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["sito/**", "raccoglitore/**", "dati/impostazioni.json", "dati/attivita-extra.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gioco
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Leggi commenti e ricalcola
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          MODERAZIONE_API_KEY: ${{ secrets.MODERAZIONE_API_KEY }}
        run: node raccoglitore/esegui.mjs
      - name: Salva i dati
        id: salva
        run: |
          git config user.name "attivita-virale-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dati sito/dati
          if git diff --cached --quiet; then
            echo "cambiato=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Aggiornamento mappa"
            git push
            echo "cambiato=si" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepara il sito
        if: steps.salva.outputs.cambiato == 'si' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: sito
      - name: Pubblica il sito
        if: steps.salva.outputs.cambiato == 'si' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
