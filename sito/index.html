<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Attività Virale: apri la tua attività nel tuo comune commentando su Instagram @attivita.virale, falla crescere e conquista l'Italia.">
<meta property="og:title" content="Attività Virale">
<meta property="og:description" content="Apri la tua attività, comune per comune. Un gioco di @attivita.virale.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Attività Virale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a full-bleed map of Italy as the game board; a signage-style header, a shop-sign panel that slides in, a tab bar like a market street. */
:root{
  --bg:#E9EEF2; --sea:#CADCE6; --land:#FAFBF8; --land-hi:#EEF3FF; --border:#AEBFCA;
  --ink:#0F1E29; --muted:#566874; --line:#D3DDE3; --card:#FFFFFF; --card-2:#F4F7F9;
  --accent:#2445D6; --accent-ink:#FFFFFF; --accent-soft:rgba(36,69,214,.10);
  --gold:#E89B00; --gold-soft:rgba(232,155,0,.14); --good:#178A4C; --hot:#E2482B;
  --shadow:0 10px 30px rgba(15,30,41,.14);
  --f-sign:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A131A; --sea:#0C1A23; --land:#162731; --land-hi:#1C2F52; --border:#2E4655;
  --ink:#E7EEF3; --muted:#8EA2AF; --line:#22343F; --card:#111F28; --card-2:#162631;
  --accent:#7D95FF; --accent-ink:#0A131A; --accent-soft:rgba(125,149,255,.16);
  --gold:#FFB81F; --gold-soft:rgba(255,184,31,.16); --good:#3CC57E; --hot:#FF6B4F;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A131A; --sea:#0C1A23; --land:#162731; --land-hi:#1C2F52; --border:#2E4655;
  --ink:#E7EEF3; --muted:#8EA2AF; --line:#22343F; --card:#111F28; --card-2:#162631;
  --accent:#7D95FF; --accent-ink:#0A131A; --accent-soft:rgba(125,149,255,.16);
  --gold:#FFB81F; --gold-soft:rgba(255,184,31,.16); --good:#3CC57E; --hot:#FF6B4F;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
header,main,nav.tabs{min-width:0}
.num{font-variant-numeric:tabular-nums}

/* header */
header{background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:5}
.head{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:38px;height:38px;flex:none}
.brand-name{font-family:var(--f-sign);font-weight:900;font-size:27px;line-height:.9;letter-spacing:.01em;text-transform:uppercase}
.brand-name b{color:var(--accent)}
.brand-sub{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:3px}
.search{flex:1;display:flex;max-width:460px;margin-left:auto;background:var(--card-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:10px 12px;font:inherit;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search button{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 16px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-weight:800;flex:none}
.demo-pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);padding:5px 9px;border-radius:999px;white-space:nowrap}

/* stage */
main{position:relative;min-height:0;overflow:hidden;background:var(--sea)}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.dragging{cursor:grabbing}
.reg{fill:var(--land);stroke:var(--border);stroke-width:.9;vector-effect:non-scaling-stroke;transition:fill .2s}
.reg:hover,.reg.on{fill:var(--land-hi)}
.city{cursor:pointer}
.city circle.dot{fill:var(--accent);fill-opacity:.85;stroke:var(--card);stroke-width:1.2;vector-effect:non-scaling-stroke}
.city.hot circle.dot{fill:var(--hot)}
.city.empty circle.dot{fill:var(--land);fill-opacity:1;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:2 2}
.city.empty text{fill:var(--muted);font-weight:700}
.empty-box{border:1.5px dashed var(--border);border-radius:14px;padding:14px;font-size:13.5px;color:var(--muted);line-height:1.45;text-align:center}
.city.mine circle.dot{fill:var(--gold);fill-opacity:1}
.city text{font-family:var(--f-sign);font-weight:800;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;pointer-events:none;letter-spacing:.02em}
.city text .n{font-family:var(--f-mono);font-weight:600;fill:var(--accent)}
.rlabel{font-family:var(--f-sign);font-weight:800;fill:var(--muted);opacity:.55;text-transform:uppercase;letter-spacing:.12em;pointer-events:none}
.crown{fill:var(--gold);pointer-events:none}

.chips{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100% - 90px));z-index:3}
.chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;box-shadow:var(--shadow);width:max-content;max-width:100%}
.chip .n{font-family:var(--f-mono)}
.chip.ticker{border-radius:14px;width:auto;font-weight:500;min-height:38px}
.ticker-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:opacity .3s}
.dotlive{width:8px;height:8px;border-radius:50%;background:var(--hot);flex:none;box-shadow:0 0 0 0 var(--hot);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,72,43,.5)}70%{box-shadow:0 0 0 8px rgba(226,72,43,0)}100%{box-shadow:0 0 0 0 rgba(226,72,43,0)}}
.vp-credit{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:14px;z-index:3;display:flex;align-items:center;gap:8px;background:#0E0E0E;color:#fff;border:0;border-radius:999px;padding:6px 12px 6px 6px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow)}
.vp-credit .vp-logo{width:26px;height:26px;border-radius:50%;display:block;border:1.5px solid rgba(255,255,255,.35)}
.vbadge{width:1em;height:1em;display:inline-block;vertical-align:-0.12em;flex:none}
.vp-head{display:flex;align-items:center;gap:12px}
.vp-head img{width:52px;height:52px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);flex:none}
.vp-name{display:inline-flex;align-items:center;gap:6px}
.vp-credit b{font-weight:800}
.vp-mark{cursor:pointer}
.vp-card{background:#0E0E0E;color:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.vp-card .eyebrow{color:rgba(255,255,255,.65)}
.vp-card .big{font-family:var(--f-sign);font-weight:900;font-size:26px;line-height:1;text-transform:uppercase}
.vp-card a,.vp-card .lnk{color:#fff;font-weight:700}
.vp-card .btn{background:#fff;color:#0E0E0E}
.vp-row{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:760px){.vp-credit{bottom:70px}.vp-credit span{display:none}}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:8px;z-index:3}
.zoom button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:700;box-shadow:var(--shadow)}
.cta-float{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:3;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 32px)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.btn.gold{background:var(--gold);color:#1B1300;box-shadow:var(--shadow)}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.small{padding:7px 11px;font-size:13px;border-radius:10px}

/* panel */
.panel{position:absolute;z-index:6;top:12px;bottom:12px;right:max(12px,env(safe-area-inset-right,0px));width:min(420px,calc(100% - 24px));background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;transform:translateX(0);transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
.panel[hidden]{display:flex!important;transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
.panel-top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-title{font-family:var(--f-sign);font-weight:900;font-size:26px;text-transform:uppercase;line-height:1;flex:1;min-width:0;text-wrap:balance}
.panel-body{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:18px;min-height:0}
.panel-body>*{flex-shrink:0}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-family:var(--f-sign);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.muted{color:var(--muted)}
.small{font-size:13px}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card);text-align:left;border-left:0;border-right:0;border-bottom:0;width:100%}
.row:first-child{border-top:0}
button.row:hover{background:var(--card-2)}
.row .rk{font-family:var(--f-mono);font-weight:600;width:24px;color:var(--muted);flex:none}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{font-family:var(--f-mono);font-weight:600;font-size:13px;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.badge.gold{background:var(--gold-soft);color:var(--gold)}
.badge.good{background:rgba(23,138,76,.13);color:var(--good)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card-2);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--f-sign);font-weight:900;font-size:26px;line-height:1}
.stat span{font-size:11.5px;color:var(--muted);font-weight:600}
.grid-cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cat{display:flex;gap:8px;align-items:center;background:var(--card-2);border-radius:12px;padding:8px 10px;min-width:0;border:0;text-align:left}
.cat .e{font-size:20px}
.cat .mid{min-width:0}
.cat .t{font-weight:700;font-size:13px}
.cat .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat.free{outline:1.5px dashed var(--border);background:transparent}
.bar{height:10px;background:var(--card-2);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.prog{height:8px;border-radius:99px;background:var(--card-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* receipt */
.receipt{background:var(--card-2);border-radius:14px 14px 0 0;padding:14px 16px 22px;font-family:var(--f-mono);font-size:13px;position:relative;
  -webkit-mask:radial-gradient(circle 7px at 50% 100%,transparent 6.5px,#000 7px) bottom/16px 100% repeat-x;mask:radial-gradient(circle 7px at 50% 100%,transparent 6.5px,#000 7px) bottom/16px 100% repeat-x}
.receipt .rr{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.receipt .rr span:last-child{text-align:right}
.receipt hr{border:0;border-top:1.5px dashed var(--border);margin:8px 0}
.receipt .tot{font-weight:600;font-size:15px}
.shopwrap{display:flex;justify-content:center;background:linear-gradient(var(--sea),var(--card-2));border-radius:14px;padding-top:10px;overflow:hidden}
.shopwrap svg{width:280px;max-width:100%;height:auto;display:block}
.ladder{display:flex;gap:4px}
.ladder i{flex:1;height:8px;border-radius:3px;background:var(--line)}
.ladder i.on{background:var(--accent)}
.ladder i.cur{background:var(--gold)}
.ladder i.gate{position:relative;outline:1.5px solid var(--ink);outline-offset:1px}
.lic{display:flex;gap:12px;align-items:center;border:1.5px dashed var(--gold);background:var(--gold-soft);border-radius:14px;padding:12px}
.lic .mid{flex:1;min-width:0}
.handle{font-family:var(--f-mono);font-weight:600}

/* countdown */
.clock{display:flex;gap:8px}
.clock div{flex:1;background:var(--ink);color:var(--card);border-radius:10px;padding:8px 0;text-align:center}
.clock b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:600}
.clock span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.president{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--gold-soft),transparent);border:1px solid var(--gold);border-radius:14px;padding:12px}
.president .big{font-family:var(--f-sign);font-weight:900;font-size:22px;line-height:1}

/* shop configurator */
.form{display:grid;gap:10px}
.form label{font-size:12.5px;font-weight:700;color:var(--muted);display:grid;gap:5px}
.form input,.form select{font:inherit;color:var(--ink);background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.price{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px}
.price .mid{flex:1;min-width:0}
.price .p{font-family:var(--f-sign);font-weight:900;font-size:24px;white-space:nowrap}
.note{font-size:12.5px;color:var(--muted);background:var(--card-2);border-radius:12px;padding:10px 12px;line-height:1.45}

/* tabs */
nav.tabs{background:var(--card);border-top:1px solid var(--line);position:relative;z-index:5}
.tabs-in{display:flex;gap:4px;justify-content:center;padding-block:8px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto}
.tab{border:0;background:transparent;border-radius:12px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;flex:none}
.tab svg{width:20px;height:20px}
.tab.on{color:var(--accent);background:var(--accent-soft)}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,12,18,.55);display:grid;place-items:center;padding:16px}
.modal-card{background:var(--card);border-radius:20px;max-width:440px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.modal-card h2{margin:0;font-family:var(--f-sign);font-weight:900;font-size:30px;text-transform:uppercase;line-height:1;text-wrap:balance}
.modal-card ol{margin:0;padding-left:20px;display:grid;gap:8px;line-height:1.45}
.story-img{width:100%;max-width:300px;align-self:center;border-radius:14px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

@media (max-width:760px){
  .brand-sub,.demo-pill{display:none}
  .brand-name{font-size:23px}
  .head{flex-wrap:wrap;gap:10px}
  .search{order:3;flex-basis:100%;max-width:none}
  .panel{top:auto;left:0;right:0;bottom:0;width:100%;max-height:72%;border-radius:20px 20px 0 0;border-left:0;border-right:0;border-bottom:0}
  .panel[hidden]{transform:translateY(105%)}
  .panel-top,.panel-body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tab{padding:6px 10px;font-size:12.5px}
  .chips{max-width:calc(100% - 80px)}
  .cta-float .btn{padding:10px 13px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header>
    <div class="head">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><rect x="4" y="14" width="32" height="22" rx="3" fill="var(--ink)"/><path d="M2 14 L6 5 H34 L38 14 Z" fill="var(--accent)"/><path d="M8 5 L6.4 14 M14 5 L13.2 14 M20 5 V14 M26 5 L26.8 14 M32 5 L33.6 14" stroke="var(--card)" stroke-width="2.2"/><rect x="9" y="20" width="9" height="16" rx="1" fill="var(--gold)"/><rect x="22" y="20" width="10" height="8" rx="1" fill="var(--card)" opacity=".85"/></svg>
        <div>
          <div class="brand-name">Attività <b>Virale</b></div>
          <div class="brand-sub">Apri la tua attività, comune per comune</div>
        </div>
      </div>
      <span class="demo-pill">Si parte da zero</span>
      <form class="search" id="searchForm" role="search">
        <input id="q" type="search" placeholder="@la_tua_attività, comune o regione" autocomplete="off" aria-label="Cerca">
        <button type="submit">Cerca</button>
      </form>
      <button class="icon-btn" id="helpBtn" aria-label="Come funziona">?</button>
    </div>
  </header>

  <main>
    <svg id="map" role="img" aria-label="Mappa d'Italia con le attività del gioco"></svg>
    <div class="chips">
      <div class="chip"><span class="dotlive"></span><span><b class="n" id="hotN">0</b> attività aperte in Italia</span></div>
      <div class="chip ticker" id="ticker"><span class="ticker-text" id="tickerText"></span></div>
    </div>
    <div class="zoom">
      <button id="zin" aria-label="Avvicina">+</button>
      <button id="zout" aria-label="Allontana">−</button>

  const c = (rec.ci!=null && cities[rec.ci]) || cityByName[String(rec.comune||"").toLowerCase()]; if(!c || !CATK[rec.cat] || !rec.h) return null;

    color: rec.colore || null, founded: Date.parse(rec.aperta) || now, promo: !!rec.promo, real: !!rec.verificata,
    emp: (rec.dipendenti||[]).map(e=>({h:e.h, inc:+e.incassi||0, role: ROLES.includes(e.ruolo)?e.ruolo:"Stagista"})), jobs: +rec.posti||0,
    about: rec.descrizione || "", paid: {}, src: Object.assign({commenti:0,storie:0,reclutati:0,dipendenti:0,voti:0}, rec.fonti||{}) };
  (rec.licenze||[]).forEach(g=>a.paid[g]=true);

}

/* shop facade drawing */
function shopSVG({name="La tua attività", color, lvl=0, cat="bar", w=280}){
  const col = color || css("--accent") || "#2445D6";
  const floors = 1 + Math.floor(lvl/3);
  const fh = 34, H = 70 + floors*fh + 30, base = H-6;
  const bw = 150 + Math.min(lvl,8)*8, bx = (280-bw)/2;
  let s = `<svg width="280" height="${H}" viewBox="0 0 280 ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Facciata di ${esc(name)}">`;
  s += `<rect x="0" y="${base}" width="280" height="6" fill="${css('--border')}"/>`;
  s += `<rect x="${bx}" y="${base - (floors*fh) - 64}" width="${bw}" height="${floors*fh + 64}" rx="4" fill="${css('--card')}" stroke="${css('--border')}"/>`;
  for(let f=0; f<floors; f++){ const y = base - 64 - (f+1)*fh + 8; for(let k=0;k<4;k++){ const wx = bx+14+k*((bw-28)/4); s += `<rect x="${wx+3}" y="${y}" width="${(bw-28)/4-6}" height="${fh-14}" rx="2" fill="${css('--sea')}"/>`; } }
  if(lvl>=12) s += `<path d="M${140-16} ${base-floors*fh-64} l6 -14 l10 10 l10 -10 l6 14z" fill="${css('--gold')}"/>`;
  else if(lvl>=9) s += `<rect x="${138}" y="${base-floors*fh-84}" width="4" height="20" fill="${css('--border')}"/><path d="M142 ${base-floors*fh-84} h16 l-4 5 l4 5 h-16z" fill="${col}"/>`;
  const sy = base - 64; // sign
  s += `<rect x="${bx-6}" y="${sy-2}" width="${bw+12}" height="24" rx="4" fill="${col}"/>`;
  const label = name.length>22 ? name.slice(0,21)+"…" : name;
  s += `<text x="140" y="${sy+15}" text-anchor="middle" font-family="Big Shoulders Display, Arial Narrow, sans-serif" font-weight="900" font-size="15" letter-spacing=".5" fill="#fff">${esc(label.toUpperCase())}</text>`;
  const ay = sy+22, n = 9, aw = (bw+12)/n;
  for(let k=0;k<n;k++){ s += `<path d="M${bx-6+k*aw} ${ay} h${aw} l-2 12 q${-aw/2+2} 7 ${-aw+4} 0 z" fill="${k%2?'#fff':col}" stroke="${col}" stroke-width=".8"/>`; }
  s += `<rect x="${bx+14}" y="${ay+16}" width="${bw*0.42}" height="${base-ay-16}" rx="2" fill="${css('--sea')}" stroke="${css('--border')}"/>`;
  s += `<text x="${bx+14+bw*0.21}" y="${ay+16+(base-ay-16)/2+8}" text-anchor="middle" font-size="22">${CATK[cat]?.e||""}</text>`;
  s += `<rect x="${bx+bw-14-bw*0.28}" y="${ay+16}" width="${bw*0.28}" height="${base-ay-16}" rx="2" fill="${col}" opacity=".85"/>`;
  s += `<circle cx="${bx+bw-14-bw*0.28+8}" cy="${ay+16+(base-ay-16)/2}" r="2.2" fill="#fff"/>`;
  return s + `</svg>`;
}

function draw(){
  svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const k = vb.w / BASE.w; // 1 = full view
  const rect = svg.getBoundingClientRect(); const px = Math.max(vb.w/rect.width, vb.h/rect.height); // svg units per css px
  shown.forEach(c=>{
    const r = c.total ? (3 + Math.sqrt(c.total/maxT)*12) * Math.max(.4, Math.min(1,k*1.1)) : 3.2*Math.max(.5,Math.min(1,k*1.1));
    c.dot.setAttribute("r", r);
    const fs = 13*px; const show = (c.total ? (rankOf.get(c) ?? 1e9) < (k>.75?8:k>.4?30:1e9) : c.w >= (k>.75?11:k>.4?4:0)) || c===current;
    c.text.style.display = show ? "" : "none";
    c.text.setAttribute("x", c.x + r + 3*px); c.text.setAttribute("y", c.y + fs*.35); c.text.setAttribute("font-size", fs);
    if(c.crown){ const s=7*px; c.crown.setAttribute("d",`M${c.x-s} ${c.y-r-2*px} l${s*.35} ${-s} l${s*.65} ${s*.6} l${s*.65} ${-s*.6} l${s*.35} ${s}z`); }
  });
  { const s = px*.85; vpMark.setAttribute("transform",`translate(${roma0.x+8*px} ${roma0.y-6*px}) scale(${s})`); }
  [...gRL.children].forEach(t=>{ t.setAttribute("x",t.dataset.x); t.setAttribute("y",t.dataset.y); t.setAttribute("font-size", 11.5*px); t.style.display = k>.35 ? "" : "none"; });
}
function fit(){ // keep aspect so the map fills the stage
  const rect = svg.getBoundingClientRect(); if(!rect.width) return;
  const ar = rect.width/rect.height, bar = BASE.w/BASE.h;
  if(ar>bar){ const w=BASE.h*ar; vb={x:BASE.x-(w-BASE.w)/2,y:BASE.y,w,h:BASE.h}; } else { const h=BASE.w/ar; vb={x:BASE.x,y:BASE.y-(h-BASE.h)/2,w:BASE.w,h}; }
  if(window.innerWidth<=760 && ar>bar===false){ vb.y -= 0; }
  full = {...vb}; draw();
}
let full = {...BASE};
let anim;
function animateTo(t, ms=450){
  cancelAnimationFrame(anim); const s={...vb}, t0=performance.now();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const step = n => { const p = reduce?1:Math.min(1,(n-t0)/ms), e = 1-Math.pow(1-p,3); vb = {x:s.x+(t.x-s.x)*e,y:s.y+(t.y-s.y)*e,w:s.w+(t.w-s.w)*e,h:s.h+(t.h-s.h)*e}; draw(); if(p<1) anim=requestAnimationFrame(step); };
  anim = requestAnimationFrame(step);
}
function zoomAt(f, cx, cy){ const w = Math.min(full.w*1.05, Math.max(full.w*.06, vb.w*f)); const ratio = w/vb.w; vb = {x: cx-(cx-vb.x)*ratio, y: cy-(cy-vb.y)*ratio, w, h: vb.h*ratio}; draw(); }
function toSvg(clientX, clientY){ const r=svg.getBoundingClientRect(); return [vb.x + (clientX-r.left)/r.width*vb.w, vb.y + (clientY-r.top)/r.height*vb.h]; }
svg.addEventListener("wheel",e=>{ e.preventDefault(); const [x,y]=toSvg(e.clientX,e.clientY); zoomAt(Math.exp(e.deltaY*.0015), x, y); },{passive:false});
const pts = new Map(); let moved=false, last=null, pinch=null;
svg.addEventListener("pointerdown",e=>{ svg.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]); moved=false; last=[e.clientX,e.clientY]; if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])}; } });
svg.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2 && pinch){ const [a,b]=[...pts.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); const [x,y]=toSvg((a[0]+b[0])/2,(a[1]+b[1])/2); zoomAt(pinch.d/d,x,y); pinch.d=d; moved=true; return; }
  const dx=e.clientX-last[0], dy=e.clientY-last[1]; if(Math.abs(dx)+Math.abs(dy)>3) { moved=true; svg.classList.add("dragging"); }
  if(moved){ const r=svg.getBoundingClientRect(); vb.x -= dx/r.width*vb.w; vb.y -= dy/r.height*vb.h; draw(); }
  last=[e.clientX,e.clientY];
});
const endPtr = e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=null; svg.classList.remove("dragging"); setTimeout(()=>{ if(!pts.size) moved=false; },0); };
svg.addEventListener("pointerup",endPtr); svg.addEventListener("pointercancel",endPtr);
$("#zin").onclick=()=>{ zoomAt(.6, vb.x+vb.w/2, vb.y+vb.h/2); };
$("#zout").onclick=()=>{ zoomAt(1.6, vb.x+vb.w/2, vb.y+vb.h/2); };
$("#zreset").onclick=()=>animateTo(full);
function focusPoint(x,y,scale=.22){ const w=full.w*scale, h=full.h*scale; const mobile = window.innerWidth<=760, desk = !mobile && !panel.hidden;

const actRow = (a,i,val) => `<button class="row" data-act="${a.id}">${i!=null?`<span class="rk">${i}</span>`:""}<span style="font-size:20px">${CATK[a.cat].e}</span><span class="mid"><div class="t">${esc(a.name)} ${a.real?'<span class="badge good">✓ verificata</span>':""}</div><div class="s"><span class="handle">@${esc(a.h)}</span> · ${esc(a.city.n)} · ${LEVELS[a.lvl][0]}</div></span><span class="v">${val ?? fmt(a.inc)}</span></button>`;

function openCity(c, zoom){
  if(!c.el) makeEl(c);
  current=c; draw(); shown.forEach(x=>x.el.classList.remove("mine"));
  const next = BUILDINGS.find(b=>b[0]>c.total) || BUILDINGS.at(-1);
  const prev = [...BUILDINGS].reverse().find(b=>b[0]<=c.total);
  const catsHTML = CATS.map(k=>{ const p=c.pion[k.k]; return p ? `<button class="cat" data-act="${p.id}"><span class="e">${k.e}</span><span class="mid"><div class="t">${k.n}</div><div class="s">Pioniere @${esc(p.h)}</div></span></button>` : `<button class="cat free" data-do="open" data-arg="${c.i}|${k.k}"><span class="e">${k.e}</span><span class="mid"><div class="t">${k.n}</div><div class="s">Libera: diventa Pioniere</div></span></button>`; }).join("");
  const jobs = c.acts.filter(a=>a.jobs>0).length;
  openPanel(esc(c.n), `
    <div class="eyebrow">${esc(c.r)} · <button class="badge" data-region="${esc(c.r)}" style="border:0">vedi regione</button></div>
    <div class="stats">
      <div class="stat"><b class="num">${fmt(c.total)}</b><span>attività</span></div>
      <div class="stat"><b class="num">${fmt(c.weekSum)}</b><span>incassi settimana</span></div>
      <div class="stat"><b class="num">${jobs}</b><span>con posti di lavoro</span></div>
    </div>
    ${c.king ? `<div class="president"><span style="font-size:30px">👑</span><div class="mid" style="flex:1;min-width:0"><div class="eyebrow">Re del comune questa settimana</div><div class="big">${esc(c.king.name)}</div><div class="small muted"><span class="handle">@${esc(c.king.h)}</span> · ${fmt(c.king.week)} incassi</div></div><button class="btn ghost small" data-act="${c.king.id}">Vedi</button></div>`:""}
    <div class="sec"><h3>Prossimo edificio</h3>
      <div class="small"><b>${next[1]}</b> a ${next[0]} attività ${prev?`<span class="muted">· già sbloccato: ${prev[1]}</span>`:""}</div>
      <div class="prog"><i style="width:${Math.min(100,c.total/next[0]*100)}%"></i></div></div>
    <div class="sec"><h3>Classifica di ${esc(c.n)}</h3>${c.total?`<div class="rows">${c.acts.slice(0,10).map((a,i)=>actRow(a,i+1)).join("")}</div>`:`<div class="empty-box"><b>${esc(c.n)} è ancora libera.</b><br>Il primo che apre un'attività qui diventa Pioniere della sua categoria per sempre.<br><br><button class="btn primary small" data-do="open" data-arg="${c.i}|bar">Apri la prima attività</button></div>`}</div>

  `, "mappa");
  if(zoom) focusPoint(c.x,c.y,.2);
}

function openRegion(R){
  document.querySelectorAll(".reg").forEach(p=>p.classList.toggle("on",p.dataset.r===R.n));
  const cs = cities.filter(c=>c.r===R.n).sort((a,b)=>(b.total-a.total)||(b.pop-a.pop));
  const kings = {}; R.acts.forEach(a=>{ if(!kings[a.cat] || a.week>kings[a.cat].week) kings[a.cat]=a; });
  const rank = Object.values(byRegion).sort((a,b)=>b.week-a.week).findIndex(x=>x===R)+1;
  openPanel(esc(R.n), `
    <div class="stats">
      <div class="stat"><b class="num">${fmt(R.acts.length)}</b><span>attività</span></div>
      <div class="stat"><b class="num">${fmt(R.week)}</b><span>incassi settimana</span></div>

function romeCountdown(){
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Rome",weekday:"short",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).map(p=>[p.type,p.value]));
  const dow = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(parts.weekday);
  let s = ((7-dow)%7)*86400 + 21*3600 - (+parts.hour*3600 + +parts.minute*60 + +parts.second);
  if(s<=0) s += 7*86400; return s;
}
function clockHTML(){ const s=romeCountdown(); const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60), x=s%60; return [[d,"giorni"],[h,"ore"],[m,"min"],[x,"sec"]].map(([v,l])=>`<div><b>${String(v).padStart(2,"0")}</b><span>${l}</span></div>`).join(""); }

/* Story image */
function makeStory(a){
  const cv=document.createElement("canvas"); cv.width=1080; cv.height=1920; const x=cv.getContext("2d");
  const col = a.color || "#2445D6";
  const g=x.createLinearGradient(0,0,0,1920); g.addColorStop(0,"#0F1E29"); g.addColorStop(1,col); x.fillStyle=g; x.fillRect(0,0,1080,1920);
  x.fillStyle="rgba(255,255,255,.06)"; for(let i=0;i<12;i++){ x.fillRect(0,i*170,1080,80); }
  x.fillStyle="#FFB81F"; x.font="900 64px 'Big Shoulders Display', Impact, sans-serif"; x.textAlign="center"; x.fillText("ATTIVITÀ VIRALE",540,190);
  x.fillStyle="#fff"; x.font="600 40px Figtree, sans-serif"; x.fillText("La mia attività",540,270);
  const img=new Image(); const s=shopSVG({name:a.name,color:col,lvl:a.lvl,cat:a.cat}).replace(/var\(--[a-z-]+\)/g,"#ccc");
  img.onload=()=>{
    x.fillStyle="rgba(255,255,255,.95)"; roundRect(x,90,330,900,820,48); x.fill();
    const ar = img.height/img.width; const w=760, h=w*ar; x.drawImage(img, 160, 330+ (820-h)/2, w, h);
    x.fillStyle="#fff"; x.textAlign="center"; x.font="900 104px 'Big Shoulders Display', Impact, sans-serif";
    wrapText(x, a.name.toUpperCase(), 540, 1300, 940, 104);
    x.font="600 46px 'IBM Plex Mono', monospace"; x.fillText("@"+a.h, 540, 1470);
    x.font="600 44px Figtree, sans-serif"; x.fillStyle="rgba(255,255,255,.85)"; x.fillText(`${a.city.n} · ${LEVELS[a.lvl][0]}`, 540, 1545);
    x.fillStyle="#FFB81F"; roundRect(x,190,1650,700,130,65); x.fill();
    x.fillStyle="#1B1300"; x.font="800 44px Figtree, sans-serif"; x.fillText("Apri la tua su @attivita.virale",540,1730);
    x.fillStyle="rgba(255,255,255,.7)"; x.font="600 32px Figtree, sans-serif"; x.fillText("un progetto Valprime · @valprime.agency",540,1855);
    const url=cv.toDataURL("image/png");
    showModal(`<h2>La tua storia</h2><img class="story-img" src="${url}" alt="Immagine per la storia di ${esc(a.name)}"><p class="small muted" style="margin:0">Nel gioco vero l'immagine si salva con un tocco e taggando il profilo nella storia prendi +20 incassi.</p><button class="btn primary" data-close>Chiudi</button>`);
  };
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);
}
function roundRect(x,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }
function wrapText(x,t,cx,y,maxW,lh){ const words=t.split(" "); let line="", lines=[]; words.forEach(w=>{ const tt=line?line+" "+w:w; if(x.measureText(tt).width>maxW && line){ lines.push(line); line=w; } else line=tt; }); lines.push(line); lines.slice(0,2).forEach((l,i)=>x.fillText(l,cx,y+i*lh)); }

  <div class="receipt num" style="text-align:center;font-size:18px;font-weight:600">${esc(city||"Il tuo comune")}, ${esc((cat||"tipo di attività").toLowerCase())}</div>
  <p class="small muted" style="margin:0">Entro qualche minuto la tua bancarella compare sulla mappa. Tagga un amico nello stesso commento: se apre anche lui, prendi +25 incassi.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn gold" data-gotab="bottega">Personalizza l'insegna</button><button class="btn ghost" data-close>Chiudi</button></div>`);
}
$("#helpBtn").onclick=showHelp;
$("#openBtn").onclick=()=>showOpen();
$("#shopBtn").onclick=()=>goTab("bottega");

/* tabs */
const ICONS = {
 mappa:'<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z M9 4v14 M15 6v14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
 borsa:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
 classifica:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM7 6H4a3 3 0 003 4M17 6h3a3 3 0 01-3 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
 lavoro:'<path d="M3 8h18v11H3zM9 8V5h6v3M3 13h18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
 negozi:'<path d="M4 10v10h16V10M3 10l2-6h14l2 6zM9 20v-6h6v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
 bottega:'<path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.5-.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>'
};
const TABS = [["mappa","Mappa"],["borsa","Borsa"],["classifica","Classifica"],["lavoro","Lavoro"],["negozi","Negozi"],["bottega","Bottega"]];
$("#tabs").innerHTML = TABS.map(([k,l])=>`<button class="tab" data-tab="${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>${l}</button>`).join("");
function setTab(k){ document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on", t.dataset.tab===k)); }
function goTab(k){
  if(k==="mappa"){ closePanel(); animateTo(full); return; }
  ({borsa:openBorsa, classifica:openClassifica, lavoro:openLavoro, negozi:openNegozi, bottega:openBottega})[k]();
  try{ localStorage.setItem("av-tab",k); }catch(e){}
}
$("#tabs").addEventListener("click",e=>{ const t=e.target.closest(".tab"); if(t) goTab(t.dataset.tab); });

/* search */
$("#searchForm").addEventListener("submit",e=>{
  e.preventDefault(); const q=$("#q").value.trim().toLowerCase().replace(/^@/,""); if(!q) return;
  if(byHandle[q]) return openAct(byHandle[q]);
  if(cityByName[q]) return openCity(cityByName[q],true);
  const R = Object.values(byRegion).find(r=>r.n.toLowerCase()===q); if(R) return openRegion(R);
  const a = acts.find(a=>a.h.toLowerCase().includes(q) || a.name.toLowerCase().includes(q)); if(a) return openAct(a);
  const c = cities.find(c=>c.n.toLowerCase().startsWith(q)); if(c) return openCity(c,true);
  toast(`Nessun risultato per "${q}". Prova un @, un comune o una regione.`);
});

/* ticker */
const EVENTS = [];
const recent = [...acts].sort((a,b)=>b.founded-a.founded).slice(0,40);
recent.forEach((a,i)=>{
  const t = now - (i*7+3)*6e4;
  if(i%4===0 && a.city.pion[a.cat]===a) EVENTS.push([t,`🚩 <b class="handle">@${esc(a.h)}</b> è Pioniere dei ${CATK[a.cat].p} di ${esc(a.city.n)}`,a]);
  else EVENTS.push([t,`${CATK[a.cat].e} <b class="handle">@${esc(a.h)}</b> ha aperto ${esc(a.name)} a ${esc(a.city.n)}`,a]);
  if(i%5===2){ const b=acts.find(x=>x.emp.length && x.city.r===a.city.r); if(b) EVENTS.push([t-2e4,`🧑‍💼 <b class="handle">@${esc(b.emp[0].h)}</b> è stato assunto da ${esc(b.name)}`,b]); }
  if(i%6===4 && a.lvl>2) EVENTS.push([t-4e4,`⬆️ ${esc(a.name)} è diventata ${LEVELS[a.lvl][0]}`,a]);
});
let ti=0; const tt=$("#tickerText");
function tick(){ if(!EVENTS.length){ tt.innerHTML = "La mappa è vuota: <b>commenta il tuo comune</b> e apri la prima attività d'Italia."; tt.style.cursor="pointer"; tt.onclick=()=>showOpen(); return; } const [t,h,a]=EVENTS[ti%EVENTS.length]; tt.style.opacity=0; setTimeout(()=>{ tt.innerHTML = `${h} <span class="muted">· ${ago(t)}</span>`; tt.style.opacity=1; tt.onclick=()=>openAct(a); tt.style.cursor="pointer"; },250); ti++; }
tick(); setInterval(tick, 4200);
$("#hotN").textContent = fmt(acts.length);

/* start */
fit(); setTab("mappa");
try{ const k=localStorage.getItem("av-tab"); if(k && k!=="mappa" && window.innerWidth>760) goTab(k); }catch(e){}
})();
</script>

</body>
</html>
